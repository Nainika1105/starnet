name: starnet

services:
  db:
    image: postgis/postgis:16-3.4
    # The official PostGIS images are amd64-only; on Apple Silicon this runs
    # under emulation. Declared explicitly so Compose does not warn each run.
    platform: linux/amd64
    environment:
      POSTGRES_USER: starnet
      POSTGRES_PASSWORD: starnet
      POSTGRES_DB: starnet
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 is the point. On a first run the entrypoint starts a
      # temporary server to create the database, and that server listens on the
      # Unix socket only (listen_addresses=''). A socket-based check passes
      # against it, the API is let through, and then the real server restarts
      # and refuses the connection. Forcing TCP means the check can only pass
      # once the server the API will actually use is accepting connections.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U starnet -d starnet -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      # The repository root, because the image also builds the dashboard it
      # serves. One container, one URL, no CORS to configure.
      context: ..
      dockerfile: api/Dockerfile
    environment:
      STARNET_DATABASE_URL: postgresql+psycopg://starnet:starnet@db:5432/starnet
      STARNET_JWT_SECRET: dev-secret-change-me
      STARNET_SEED_ON_STARTUP: "true"
      STARNET_MEDIA_ROOT: /media
    ports:
      - "8000:8000"
    volumes:
      - media_data:/media
    # Belt and braces for first boot: if the API still loses the race to the
    # database, it comes back rather than leaving the stack half up.
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  # Optional, for front-end work only: the Vite dev server with hot reload on
  # port 5173, talking to the API on 8000. The API already serves a built copy
  # of this dashboard at http://localhost:8000, which is the one to open or
  # share. Start it explicitly: docker compose up admin
  admin:
    profiles: ["dev"]
    build:
      context: ../admin
      target: dev
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
  media_data:
